<!DOCTYPE html>
<html>
    <head>
        <title>My Portfolio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width" intial-scale="1.0">
        <!-- <link rel="stylesheet" href="style1.css"> -->
        <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">
        <style>
            body{
    background: linear-gradient(to right, #bbbbd6, rgb(245, 245, 247));
}

.container{
    display: flex;
    justify-content: center;
    height: 100vh;
    animation: fadeIn 2.5s ease-in-out;
}
.card{
    width: 300px;
    height: 500px;
    margin-top: 80px;
    padding: 20px;
    background-color: rgb(253, 253, 255);
    border: 30px solid  #bbbbd6;
    border-radius: 20px;
    box-shadow: 12px 15px 30px rgba(5, 0, 0, 0.2);
    text-align: center;
    /* backdrop-filter: blur(10px); */
    transition: 0.3s ease;
}
.card:hover{
    transform: scale(1.05);
}
h3{
    font-size: 20px;
    padding-bottom: 1px;
    padding-left: 6px;
    margin-bottom: 1px;
    padding-top: -40px;
}
h1{
    position: relative;
    font-weight: 500;
    padding-bottom: 2px;

}
.profile-img{
    border-radius: 15px;
    border: 4px solid  #bbbbd6;
    background-color: white;
    margin-top: 5px;
    transition: transform 0.3s ease;
}

.button {
    background-color: #ced0d3;
    color: black;
    padding: 10px 20px;
    border-radius: 6px;
    transition: all 0.8s ease;
    margin-bottom: 30px;
}
 .button:hover{
    background-color: azure;
    transform: scale(1.1);
 }
 .btns{
    display:flex;
    justify-content: space-between;
 }
 .socials {
    margin-top: 20px;
 }
 .socials i{
    font-size: 2px;
    color: black;
    margin: 0 15px;
    display: block;
    transition: transform 0.3s ease, color 0.3s ease;
 }
 .socials i:hover{
    color:#ffdd57;
    transform: scale(1.2);
 }
 @keyframes fadeIn {
    from {opacity: 0; transform: translateY(30px);
    }
    to { opacity: 1; transform: translateY(0);
    }
 }
 @media (max-width: 768px){
    .profile-img{
        width: 120px;
        height: 120px;
    }
    h1 {
        font-size: 1.5px;
    }
    p {
        font-size: 1px;
    }
 }
 
        </style>
    </head>
    <body>
        <section class="container">
            <article class="card">
                <div>
                <img class="profile-img" src="./myportfoliopic.jpg" alt="profile picture"
                width="180" height="200">
                </div>
                <div>
                <h1>Hi, I'm Marvellous</h1>
                <h3>Full stack developer</h3>
                <p>I am a web developer in Nigeria 
                    and I am very passionate and dedicated to my work</p>
                </div>
                 <div class="btns">
                    <button class="button">Download CV </button>
                    <button class="button"><a href="">Contact me</a></button>
                </div>
                <footer class="socials">
                    <a href="#" target="_blank"><i class="fa fa-instagram" aria-hidden="true"></i></a>
                    <a href="www.instagram.com"><i class="fa fa-whatsapp" aria-hidden="true"></i></a>
                    <h4>All is good</h4>
                </footer>
            </article>
        </section>

    </body>
</html>
